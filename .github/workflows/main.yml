name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o *.zip -d temp_unzip
          shopt -s dotglob
          mv temp_unzip/*/* . 2>/dev/null || mv temp_unzip/* . 2>/dev/null || true
          rm -rf temp_unzip
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zero-two-apk
          path: app/build/outputs/apk/debug/app-debug.apk
