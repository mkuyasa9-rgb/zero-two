name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "ZIP: $ZIP"
          unzip -o "$ZIP"
          rm "$ZIP"
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Debug APK
        run: |
          GRADLEW=$(find . -name gradlew | head -n 1)
          echo "Found: $GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zero-two-apk
          path: "**/*.apk"
